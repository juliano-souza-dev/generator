name: Build Desktop Installer

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "app.py"
      - "ai_provider.py"
      - "requirements*.txt"
      - ".github/workflows/build-desktop-installer.yml"
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm desktop/ImmersionHubGenerator.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/ImmersionHubGenerator/ImmersionHubGenerator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--healthcheck" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path $env:LOCALAPPDATA "ImmersionHub Generator\healthcheck-error.log"
            if (Test-Path $errorLog) {
              Write-Host "===== packaged healthcheck traceback ====="
              Get-Content $errorLog
              Write-Host "========================================="
            }
            throw "Packaged Generator healthcheck failed with exit code $($process.ExitCode)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop\installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImmersionHub-Generator-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
