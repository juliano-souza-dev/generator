name: Build Java Desktop Installer

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-java-desktop.yml"
  workflow_dispatch:

concurrency:
  group: java-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Test and package Java app
        shell: pwsh
        run: |
          mvn -B clean test package
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/app
          Copy-Item "target/generator-desktop-0.1.0-test.jar" "target/app/generator-desktop.jar"

          New-Item -ItemType Directory -Force -Path "target/app/tools" | Out-Null

          $ytdlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe"
          $ytdlpPath = "target/app/tools/yt-dlp.exe"
          Invoke-WebRequest -Uri $ytdlpUrl -OutFile $ytdlpPath
          $ytdlpExpected = "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"
          $ytdlpActual = (Get-FileHash -Path $ytdlpPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ytdlpActual -ne $ytdlpExpected) { throw "Bundled source tool checksum mismatch" }

          $ffmpegUrl = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/autobuild-2026-09-16-22-24/ffmpeg-N-126619-g8f1e6edbab-win64-gpl-shared.zip"
          $ffmpegZip = "target/ffmpeg.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          $ffmpegExpected = "03af4e326f9904e8ec1ac405ee57b67867db3386c61f662d7e3821517d6b8e4d"
          $ffmpegActual = (Get-FileHash -Path $ffmpegZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ffmpegActual -ne $ffmpegExpected) { throw "Bundled media tool checksum mismatch" }

          $ffmpegExtract = "target/ffmpeg-extract"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegRoot = Get-ChildItem -Path $ffmpegExtract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "target/app/tools/ffmpeg" | Out-Null
          Copy-Item -Path (Join-Path $ffmpegRoot.FullName "bin\*") -Destination "target/app/tools/ffmpeg" -Recurse -Force

          $whisperUrl = "https://github.com/ggml-org/whisper.cpp/releases/download/b5130/whisper-bin-x64.zip"
          $whisperZip = "target/whisper.zip"
          Invoke-WebRequest -Uri $whisperUrl -OutFile $whisperZip
          $whisperExpected = "f9ec6c52a2e949b62ab51fa21d0d497958f9e41c3010c157c4e42932d5316f3c"
          $whisperActual = (Get-FileHash -Path $whisperZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($whisperActual -ne $whisperExpected) { throw "Bundled transcription tool checksum mismatch" }

          $whisperExtract = "target/whisper-extract"
          Expand-Archive -Path $whisperZip -DestinationPath $whisperExtract -Force
          $whisperCli = Get-ChildItem -Path $whisperExtract -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $whisperCli) { throw "whisper-cli.exe not found in release archive" }
          New-Item -ItemType Directory -Force -Path "target/app/tools/whisper" | Out-Null
          Copy-Item -Path (Join-Path $whisperCli.Directory.FullName "*") -Destination "target/app/tools/whisper" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "target/app/tools/whisper/models" | Out-Null
          $whisperModel = "target/app/tools/whisper/models/ggml-base.en.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin?download=true" -OutFile $whisperModel
          $modelExpected = "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002"
          $modelActual = (Get-FileHash -Path $whisperModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelActual -ne $modelExpected) { throw "Bundled transcription model checksum mismatch" }

      - name: Build self-contained app image
        shell: pwsh
        run: jpackage --type app-image --name "ImmersionHub Generator" --dest target/app-image --input target/app --main-jar generator-desktop.jar --main-class br.com.immersionhub.generator.desktop.GeneratorLauncher --app-version 0.1.0 --vendor "ImmersionHub"

      - name: Smoke test bundled runtime and media pipeline
        shell: pwsh
        run: |
          $exe = Resolve-Path "target/app-image/ImmersionHub Generator/ImmersionHub Generator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Java desktop smoke test failed with exit code $($process.ExitCode)" }

          $ytdlp = Resolve-Path "target/app-image/ImmersionHub Generator/app/tools/yt-dlp.exe"
          $ytdlpProcess = Start-Process -FilePath $ytdlp -ArgumentList "--version" -PassThru -Wait
          if ($ytdlpProcess.ExitCode -ne 0) { throw "Bundled source tool smoke test failed" }

          $whisper = Resolve-Path "target/app-image/ImmersionHub Generator/app/tools/whisper/whisper-cli.exe"
          $whisperProcess = Start-Process -FilePath $whisper -ArgumentList "--version" -PassThru -Wait
          if ($whisperProcess.ExitCode -ne 0) { throw "Bundled transcription tool smoke test failed" }

          $whisperModel = Resolve-Path "target/app-image/ImmersionHub Generator/app/tools/whisper/models/ggml-base.en.bin"
          $modelActual = (Get-FileHash -Path $whisperModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelActual -ne "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002") {
            throw "Packaged transcription model checksum mismatch"
          }

          $ffmpeg = Resolve-Path "target/app-image/ImmersionHub Generator/app/tools/ffmpeg/ffmpeg.exe"
          & $ffmpeg -hide_banner -loglevel error -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled media tool smoke test failed" }

          $sample = (Join-Path (Get-Location) "target/timing-smoke-source.mp4")
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=320x180:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac $sample
          if ($LASTEXITCODE -ne 0) { throw "Could not create timing smoke media" }

          $timing = Start-Process -FilePath $exe -ArgumentList @("--timing-smoke", $sample) -PassThru -Wait
          if ($timing.ExitCode -ne 0) { throw "Packaged timing pipeline smoke test failed with exit code $($timing.ExitCode)" }

          $speechSource = (Join-Path (Get-Location) "target/jfk.wav")
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ggml-org/whisper.cpp/927cfce34f31707e17f2bff35c349632fb9e2c3a/samples/jfk.wav" -OutFile $speechSource
          $speech = (Join-Path (Get-Location) "target/preparation-smoke.wav")
          & $ffmpeg -hide_banner -loglevel error -y -i $speechSource -t 2 -ac 1 -ar 16000 -c:a pcm_s16le $speech
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare speech smoke media" }

          $whisperSmokePrefix = (Join-Path (Get-Location) "target/whisper-smoke")
          $whisperStart = [System.Diagnostics.ProcessStartInfo]::new()
          $whisperStart.FileName = [string]$whisper
          $whisperStart.UseShellExecute = $false
          foreach ($argument in @(
            "-m", [string]$whisperModel,
            "-f", [string]$speech,
            "-l", "en",
            "-ng",
            "-dtw", "base.en",
            "-nfa",
            "-ojf",
            "-of", [string]$whisperSmokePrefix
          )) {
            [void]$whisperStart.ArgumentList.Add($argument)
          }
          $whisperSmoke = [System.Diagnostics.Process]::Start($whisperStart)
          if (-not $whisperSmoke.WaitForExit(120000)) {
            try { $whisperSmoke.Kill($true) } catch {}
            throw "Bundled ASR/alignment smoke timed out"
          }
          $whisperSmoke.Refresh()
          if ($whisperSmoke.ExitCode -ne 0) { throw "Bundled ASR/alignment smoke failed with exit code $($whisperSmoke.ExitCode)" }

          $whisperJson = "$whisperSmokePrefix.json"
          if (-not (Test-Path $whisperJson)) { throw "Bundled ASR/alignment smoke did not produce JSON" }
          $whisperResult = Get-Content $whisperJson -Raw | ConvertFrom-Json
          $segments = @($whisperResult.transcription)
          if ($segments.Count -lt 1) { throw "Bundled ASR smoke produced no transcription segments" }
          $spokenText = (($segments | ForEach-Object { [string]$_.text }) -join " ").Trim()
          if ([string]::IsNullOrWhiteSpace($spokenText)) { throw "Bundled ASR smoke produced empty transcription" }

          $validDtwTokens = @(
            $segments |
              ForEach-Object { @($_.tokens) } |
              Where-Object {
                $_ -and
                ([string]$_.text) -notmatch '^\[_' -and
                [double]$_.t_dtw -ge 0
              }
          )
          if ($validDtwTokens.Count -lt 1) { throw "Bundled alignment smoke produced no DTW token anchors" }

          foreach ($segment in $segments) {
            $from = [long]$segment.offsets.from
            $to = [long]$segment.offsets.to
            if ($from -lt 0 -or $to -le $from -or $to -gt 2000) {
              throw "Bundled ASR/alignment smoke produced timing outside media duration"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/installer" | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Install and smoke test generated Setup
        shell: pwsh
        run: |
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [int]$TimeoutSeconds = 180,
              [string]$Label = "process"
            )

            Write-Host "PHASE: $Label"
            Write-Host "RUN: $FilePath $($Arguments -join ' ')"
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru

            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              try { $process.Kill($true) } catch {}
              throw "$Label timed out after $TimeoutSeconds seconds"
            }

            $process.Refresh()
            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              throw "$Label failed with exit code $($process.ExitCode)"
            }
          }

          $installer = Get-ChildItem "target/installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }

          $installLog = Join-Path (Get-Location) "target/installer-install.log"
          try {
            Invoke-BoundedProcess -FilePath $installer.FullName -Arguments @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$installLog") -TimeoutSeconds 180 -Label "EXE install"
          } catch {
            if (Test-Path $installLog) {
              Write-Host "===== installer log ====="
              Get-Content $installLog
              Write-Host "========================="
            }
            throw
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\ImmersionHub Generator"
          $installedExe = Join-Path $installDir "ImmersionHub Generator.exe"
          $dataDir = Join-Path $env:LOCALAPPDATA "ImmersionHub Generator"

          if (-not (Test-Path $installedExe)) {
            throw "Installed launcher was not found at $installedExe"
          }

          $installDirFull = [IO.Path]::GetFullPath($installDir)
          $dataDirFull = [IO.Path]::GetFullPath($dataDir)
          if ($dataDirFull.StartsWith($installDirFull, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Persistent data directory is inside the application installation directory"
          }

          Invoke-BoundedProcess -FilePath $installedExe -Arguments @("--smoke-test") -TimeoutSeconds 90 -Label "installed launcher smoke"

          $sample = Resolve-Path "target/timing-smoke-source.mp4"
          Invoke-BoundedProcess -FilePath $installedExe -Arguments @("--timing-smoke", $sample) -TimeoutSeconds 120 -Label "installed timing smoke"

          $installedWhisper = Join-Path $installDir "app\tools\whisper\whisper-cli.exe"
          $installedWhisperModel = Join-Path $installDir "app\tools\whisper\models\ggml-base.en.bin"
          if (-not (Test-Path $installedWhisper) -or -not (Test-Path $installedWhisperModel)) {
            throw "Installed transcription runtime/model is missing"
          }
          Invoke-BoundedProcess -FilePath $installedWhisper -Arguments @("--version") -TimeoutSeconds 30 -Label "installed transcription runtime smoke"

          if (-not (Test-Path $dataDir)) {
            throw "Persistent data directory was not created at $dataDir"
          }

          $persistenceMarker = Join-Path $dataDir "qa-persistence.marker"
          Set-Content -Path $persistenceMarker -Value "keep" -Encoding UTF8

          Write-Host "PHASE: upgrade while packaged runtime file is locked"
          $runtimeDll = Join-Path $installDir "runtime\bin\java.dll"
          if (-not (Test-Path $runtimeDll)) {
            throw "Installed runtime lock target was not found at $runtimeDll"
          }

          $lockScript = Join-Path (Get-Location) "target\hold-runtime-lock.ps1"
          @'
          param([string]$Path)
          $stream = [System.IO.File]::Open(
            $Path,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::Read,
            [System.IO.FileShare]::None
          )
          try {
            Start-Sleep -Seconds 180
          } finally {
            $stream.Dispose()
          }
          '@ | Set-Content -Path $lockScript -Encoding UTF8

          $lockProcess = Start-Process -FilePath "pwsh.exe" -ArgumentList @(
            "-NoProfile",
            "-File", $lockScript,
            $runtimeDll
          ) -PassThru
          Start-Sleep -Seconds 2
          $lockProcess.Refresh()
          if ($lockProcess.HasExited) {
            throw "Runtime lock regression helper exited before upgrade"
          }

          $upgradeLog = Join-Path (Get-Location) "target\installer-upgrade.log"
          try {
            Invoke-BoundedProcess -FilePath $installer.FullName -Arguments @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/CLOSEAPPLICATIONS",
              "/FORCECLOSEAPPLICATIONS",
              "/NORESTARTAPPLICATIONS",
              "/LOG=$upgradeLog"
            ) -TimeoutSeconds 180 -Label "locked-runtime upgrade"
          } catch {
            try {
              $lockProcess.Refresh()
              if (-not $lockProcess.HasExited) { $lockProcess.Kill($true) }
            } catch {}
            if (Test-Path $upgradeLog) {
              Write-Host "===== upgrade installer log ====="
              Get-Content $upgradeLog
              Write-Host "================================="
            }
            throw
          }

          $lockProcess.Refresh()
          if (-not $lockProcess.HasExited) {
            try { $lockProcess.Kill($true) } catch {}
            throw "Installer did not close the process holding runtime\bin\java.dll"
          }

          if (-not (Test-Path $installedExe)) {
            throw "Installed launcher is missing after in-place upgrade"
          }
          if (-not (Test-Path $persistenceMarker)) {
            throw "In-place upgrade removed persistent user data"
          }

          $packagedRoot = (Resolve-Path "target/app-image/ImmersionHub Generator").Path
          $criticalRoots = @(
            "runtime",
            "app\tools\whisper",
            "app\tools\ffmpeg"
          )
          foreach ($relativeRoot in $criticalRoots) {
            $sourceRoot = Join-Path $packagedRoot $relativeRoot
            Get-ChildItem -Path $sourceRoot -File -Recurse | ForEach-Object {
              $relativeFile = $_.FullName.Substring($packagedRoot.Length).TrimStart('\')
              $installedFile = Join-Path $installDir $relativeFile
              if (-not (Test-Path $installedFile)) {
                throw "Upgrade left packaged dependency missing: $relativeFile"
              }

              $sourceLength = $_.Length
              $installedLength = (Get-Item $installedFile).Length
              if ($sourceLength -ne $installedLength) {
                throw "Upgrade left packaged dependency with wrong size: $relativeFile"
              }
            }
          }

          Invoke-BoundedProcess -FilePath $installedExe -Arguments @("--smoke-test") -TimeoutSeconds 90 -Label "post-upgrade launcher smoke"

          Write-Host "PHASE: discover registered uninstaller"
          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "ImmersionHub Generator" } |
            Select-Object -First 1

          if (-not $entry) {
            throw "Registered uninstaller for ImmersionHub Generator was not found"
          }

          $hasQuietUninstall = -not [string]::IsNullOrWhiteSpace([string]$entry.QuietUninstallString)
          $uninstallCommand = if ($hasQuietUninstall) {
            [string]$entry.QuietUninstallString
          } else {
            [string]$entry.UninstallString
          }

          if (-not $hasQuietUninstall) {
            $uninstallCommand = "$uninstallCommand /VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          }

          Write-Host "Registered uninstall command: $uninstallCommand"

          if ($uninstallCommand.StartsWith('"')) {
            $closingQuote = $uninstallCommand.IndexOf('"', 1)
            if ($closingQuote -lt 2) { throw "Invalid quoted uninstall command: $uninstallCommand" }
            $uninstallExe = $uninstallCommand.Substring(1, $closingQuote - 1)
            $uninstallTail = $uninstallCommand.Substring($closingQuote + 1).Trim()
          } else {
            $parts = $uninstallCommand -split '\s+', 2
            $uninstallExe = $parts[0]
            $uninstallTail = if ($parts.Count -gt 1) { $parts[1] } else { "" }
          }

          $uninstallArgs = if ([string]::IsNullOrWhiteSpace($uninstallTail)) {
            @()
          } else {
            @($uninstallTail)
          }
          Invoke-BoundedProcess -FilePath $uninstallExe -Arguments $uninstallArgs -TimeoutSeconds 180 -Label "registered uninstall"

          if (Test-Path $installedExe) {
            throw "Installed launcher still exists after uninstall"
          }

          if (-not (Test-Path $persistenceMarker)) {
            throw "Uninstall removed persistent user data"
          }

          Write-Host "Installer lifecycle PASS: install, locked-runtime upgrade, installed smoke, uninstall, persistent-data preservation"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImmersionHub-Generator-Java-Windows
          path: desktop/target/installer/*.exe
          if-no-files-found: error
          retention-days: 14
